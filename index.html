<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恆等式神射手 - 數學代數射擊遊戲</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
        }

        #game-canvas {
            /* Clean soft eye-friendly light gradient */
            background: linear-gradient(to bottom, #f0fdf4 0%, #e6f4ea 60%, #dcfce7 100%);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            transition: transform 0.05s ease-out;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
        }

        .heart-bounce {
            animation: heartPulse 1.2s infinite ease-in-out;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        /* Screen Shake Keyframes */
        .shake-screen {
            animation: screenShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center relative overflow-hidden bg-slate-100">

    <!-- TOP HUD BAR -->
    <header class="w-full max-w-5xl px-4 py-3 z-20 flex items-center justify-between pointer-events-auto mt-1">
        <!-- Player Info & Lives Counter -->
        <div class="flex items-center gap-3 bg-white/95 px-4 py-2 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex flex-col">
                <span id="hud-player-name" class="text-xs font-black text-emerald-700 max-w-[100px] truncate">神射手</span>
                <div id="lives-container" class="flex gap-1.5 text-base text-rose-500 mt-0.5">
                    <i class="fa-solid fa-heart heart-bounce"></i>
                    <i class="fa-solid fa-heart heart-bounce"></i>
                    <i class="fa-solid fa-heart heart-bounce"></i>
                </div>
            </div>
        </div>

        <!-- Current Question Display Banner -->
        <div class="flex-1 mx-3 sm:mx-6 bg-slate-900 border border-slate-700 rounded-2xl py-2.5 px-4 text-center shadow-lg">
            <div id="question-level" class="text-[11px] font-bold text-emerald-400 tracking-wider">第 1 題 / 關卡 1</div>
            <div id="question-text" class="text-lg sm:text-2xl font-black text-amber-300 tracking-wide font-mono drop-shadow-sm">
                展開：(x + 3)²
            </div>
        </div>

        <!-- Score & Combo -->
        <div class="flex items-center gap-3 bg-white/95 px-4 py-2 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-right">
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">總得分</div>
                <div id="score-text" class="text-xl font-black text-slate-800 font-mono">0000</div>
            </div>
            <div id="combo-badge" class="hidden sm:flex flex-col items-center justify-center bg-amber-100 px-2 py-0.5 rounded-lg border border-amber-300 text-amber-800">
                <span class="text-[9px] font-extrabold uppercase">Combo</span>
                <span id="combo-count" class="text-xs font-black">x1</span>
            </div>
        </div>
    </header>

    <!-- MAIN GAME CANVAS CONTAINER -->
    <div class="relative flex-1 w-full max-w-5xl my-2 flex items-center justify-center px-2">
        <canvas id="game-canvas" class="w-full h-full rounded-3xl border border-slate-300 cursor-crosshair"></canvas>
        
        <!-- Aim Helper Overlay Label -->
        <div id="aim-hint" class="absolute bottom-6 pointer-events-none text-slate-700 text-xs sm:text-sm font-bold flex items-center gap-2 bg-white/90 px-4 py-2 rounded-full border border-slate-300 backdrop-blur shadow-md">
            <i class="fa-solid fa-hand-pointer animate-bounce text-emerald-600"></i>
            拉動弓箭瞄準方向，鬆開即可射擊正確答案靶！
        </div>
    </div>

    <!-- START GAME MODAL (Cleaned main screen without green box, added nickname input) -->
    <div id="start-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-md">
        <div class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 text-center shadow-2xl border border-slate-200 animate-pop-in">
            <div class="w-16 h-16 bg-emerald-600 rounded-2xl mx-auto flex items-center justify-center text-3xl text-white shadow-lg shadow-emerald-600/30 mb-4">
                <i class="fa-solid fa-bullseye"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black text-slate-800 mb-1">恆等式神射手</h1>
            <p class="text-xs sm:text-sm text-slate-500 mb-6">準確拉弓射擊帶有正確展開式的目標靶！</p>
            
            <!-- Nickname Input Section -->
            <div class="mb-6 text-left">
                <label for="nickname-input" class="block text-xs font-bold text-slate-600 mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-user-pen text-emerald-600"></i> 請輸入神射手暱稱：
                </label>
                <input type="text" id="nickname-input" maxlength="12" placeholder="例如：解題小俠" value="數學小學霸"
                    class="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none text-slate-800 font-bold transition-all bg-white text-base">
            </div>

            <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-lg shadow-lg shadow-emerald-600/30 transition-all transform hover:scale-[1.02]">
                <i class="fa-solid fa-play mr-2"></i> 開始挑戰
            </button>
        </div>
    </div>

    <!-- GAME OVER / SETTLEMENT MODAL -->
    <div id="gameover-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 text-center border border-slate-200 shadow-2xl">
            <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 id="gameover-title" class="text-2xl sm:text-3xl font-black text-slate-800 mb-1">挑戰結束！</h2>
            <p id="gameover-subtitle" class="text-xs font-bold text-slate-500 mb-6">神射手 <span id="settlement-nickname" class="text-emerald-600">--</span> 的戰報</p>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center">
                    <span class="text-[10px] text-slate-400 font-bold uppercase block">最終得分</span>
                    <span id="final-score" class="text-2xl font-black text-emerald-600 font-mono">0</span>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center">
                    <span class="text-[10px] text-slate-400 font-bold uppercase block">答對題數</span>
                    <span id="final-questions" class="text-2xl font-black text-slate-800 font-mono">0</span>
                </div>
            </div>

            <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-lg shadow-lg shadow-emerald-600/20 transition-all transform hover:scale-[1.02]">
                <i class="fa-solid fa-rotate-right mr-2"></i> 再次挑戰
            </button>
        </div>
    </div>

    <script>
        /* SOUND SYNTHESIZER (Web Audio API) */
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(480, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playHitCorrect() {
                if (!this.ctx) return;
                // High joyful double-chime for correct hit
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'triangle';
                osc2.type = 'sine';

                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc1.frequency.setValueAtTime(783.99, now + 0.16); // G5

                osc2.frequency.setValueAtTime(1046.5, now); // C6
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.4);
                osc2.stop(now + 0.4);
            }

            playHitWrong() {
                if (!this.ctx) return;
                // Low harsh buzz for wrong hit
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(110, now + 0.1);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const soundFX = new SoundEffects();

        /* QUESTION GENERATOR */
        class QuestionGenerator {
            static generate(level) {
                const types = ['sq_sum', 'sq_diff', 'diff_sq'];
                const selectedType = types[Math.floor(Math.random() * types.length)];
                
                let qText = '';
                let correctAns = '';
                let distractors = [];

                const a = Math.floor(Math.random() * (level > 3 ? 3 : 2)) + 1;
                const b = Math.floor(Math.random() * (4 + Math.min(level, 5))) + 1;
                const varName = 'x';

                if (selectedType === 'sq_sum') {
                    const aStr = a === 1 ? varName : `${a}${varName}`;
                    qText = `展開：(${aStr} + ${b})²`;

                    const term1 = a * a === 1 ? `${varName}²` : `${a * a}${varName}²`;
                    const mid = 2 * a * b;
                    const end = b * b;

                    correctAns = `${term1} + ${mid}${varName} + ${end}`;
                    distractors = [
                        `${term1} + ${end}`, 
                        `${term1} + ${a * b}${varName} + ${end}`, 
                        `${term1} - ${mid}${varName} + ${end}`, 
                        `${term1} + ${mid}${varName} + ${b * 2}` 
                    ];
                } else if (selectedType === 'sq_diff') {
                    const aStr = a === 1 ? varName : `${a}${varName}`;
                    qText = `展開：(${aStr} - ${b})²`;

                    const term1 = a * a === 1 ? `${varName}²` : `${a * a}${varName}²`;
                    const mid = 2 * a * b;
                    const end = b * b;

                    correctAns = `${term1} - ${mid}${varName} + ${end}`;
                    distractors = [
                        `${term1} - ${end}`, 
                        `${term1} - ${mid}${varName} - ${end}`, 
                        `${term1} + ${mid}${varName} + ${end}`, 
                        `${term1} - ${a * b}${varName} + ${end}` 
                    ];
                } else {
                    const aStr = a === 1 ? varName : `${a}${varName}`;
                    qText = `展開：(${aStr} + ${b})(${aStr} - ${b})`;

                    const term1 = a * a === 1 ? `${varName}²` : `${a * a}${varName}²`;
                    const end = b * b;

                    correctAns = `${term1} - ${end}`;
                    distractors = [
                        `${term1} + ${end}`, 
                        `${term1} - ${2 * a * b}${varName} - ${end}`, 
                        `${term1} - ${b * 2}`, 
                        `${a === 1 ? varName : a + varName} - ${end}` 
                    ];
                }

                const uniqueDistractors = [...new Set(distractors.filter(d => d !== correctAns))];
                const selectedDistractors = uniqueDistractors.sort(() => 0.5 - Math.random()).slice(0, 3);

                const options = [
                    { text: correctAns, isCorrect: true },
                    ...selectedDistractors.map(d => ({ text: d, isCorrect: false }))
                ].sort(() => 0.5 - Math.random());

                return {
                    question: qText,
                    options: options
                };
            }
        }

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        let gameState = {
            active: false,
            playerName: "數學小學霸",
            score: 0,
            lives: 3,
            level: 1,
            questionCount: 0,
            combo: 0,
            currentQuestion: null,
            questionStartTime: 0
        };

        // Game Entities
        let bow = { x: 0, y: 0, angle: -Math.PI / 2, isDragging: false };
        let arrow = null;
        let targets = [];
        let particles = [];
        let targetShards = [];
        let floatingTexts = []; // Floating feedback messages (Correct/Wrong popups)
        let bgElements = [];

        function initBackgroundElements() {
            bgElements = [];
            const symbols = ['(a+b)²', 'x²', 'a²-b²', '≡', '+', '−', '2ab', '(x−y)²'];
            for (let i = 0; i < 12; i++) {
                bgElements.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.2 - 0.1,
                    text: symbols[Math.floor(Math.random() * symbols.length)],
                    size: Math.random() * 12 + 14,
                    alpha: Math.random() * 0.12 + 0.05,
                    isCloud: Math.random() > 0.6,
                    radius: Math.random() * 28 + 18
                });
            }
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            bow.x = canvas.width / 2;
            bow.y = canvas.height - 70;

            initBackgroundElements();
        }

        window.addEventListener('resize', resizeCanvas);

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handlePointerDown(e) {
            if (!gameState.active || arrow) return;
            soundFX.init();
            const pos = getPointerPos(e);
            bow.isDragging = true;
            updateBowAngle(pos);
        }

        function handlePointerMove(e) {
            if (!bow.isDragging) return;
            const pos = getPointerPos(e);
            updateBowAngle(pos);
        }

        function handlePointerUp() {
            if (!bow.isDragging) return;
            bow.isDragging = false;
            shootArrow();
        }

        function updateBowAngle(pos) {
            const dx = pos.x - bow.x;
            const dy = pos.y - bow.y;
            let angle = Math.atan2(dy, dx);
            // Limit aim angle to upper hemisphere
            if (angle > -0.15) angle = -0.15;
            if (angle < -Math.PI + 0.15) angle = -Math.PI + 0.15;
            bow.angle = angle;
        }

        function shootArrow() {
            if (arrow) return;
            const speed = 22;
            arrow = {
                x: bow.x,
                y: bow.y,
                vx: Math.cos(bow.angle) * speed,
                vy: Math.sin(bow.angle) * speed,
                active: true
            };
            soundFX.playShoot();
            document.getElementById('aim-hint').classList.add('hidden');
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, { passive: false });
        window.addEventListener('touchend', handlePointerUp);

        function spawnTargets(questionData) {
            targets = [];
            const count = questionData.options.length;
            const padding = 20;
            const usableWidth = canvas.width - padding * 2;
            const step = usableWidth / count;

            questionData.options.forEach((opt, idx) => {
                const x = padding + step * idx + step / 2;
                const y = 90 + (idx % 2 === 0 ? 0 : 35);
                
                const speed = (Math.random() * 0.8 + 0.4) * (1 + (gameState.level - 1) * 0.15);
                const dir = idx % 2 === 0 ? 1 : -1;

                targets.push({
                    x: x,
                    y: y,
                    radius: Math.min(step * 0.42, 54),
                    text: opt.text,
                    isCorrect: opt.isCorrect,
                    vx: speed * dir,
                    scale: 1,
                    hitState: null // 'correct' or 'wrong'
                });
            });
        }

        // Distinct Particles & Shatter Animations for Correct vs Wrong Target
        function createShatterEffect(target, isCorrect) {
            const numShards = 10;
            const angleStep = (Math.PI * 2) / numShards;

            for (let i = 0; i < numShards; i++) {
                const startAngle = i * angleStep;
                const endAngle = (i + 1) * angleStep;
                const midAngle = (startAngle + endAngle) / 2;
                const speed = isCorrect ? (Math.random() * 6 + 4) : (Math.random() * 3 + 2);

                targetShards.push({
                    x: target.x,
                    y: target.y,
                    radius: target.radius,
                    startAngle: startAngle,
                    endAngle: endAngle,
                    vx: Math.cos(midAngle) * speed,
                    vy: Math.sin(midAngle) * speed + (isCorrect ? 0 : 2), // wrong shards fall heavy
                    rotation: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.3,
                    alpha: 1,
                    color: isCorrect ? (i % 2 === 0 ? '#10b981' : '#f59e0b') : (i % 2 === 0 ? '#ef4444' : '#64748b'),
                    textColor: target.text
                });
            }

            // Burst particle dust
            const particleCount = isCorrect ? 35 : 20;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (isCorrect ? 8 : 4) + 2;
                particles.push({
                    x: target.x,
                    y: target.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 6 + 2,
                    color: isCorrect ? (i % 2 === 0 ? '#fbbf24' : '#34d399') : (i % 2 === 0 ? '#f87171' : '#475569'),
                    alpha: 1,
                    decay: Math.random() * 0.025 + 0.015
                });
            }

            // Floating Text Popup Animation
            floatingTexts.push({
                x: target.x,
                y: target.y - 10,
                text: isCorrect ? `✔ 正確！ +100` : `❌ 錯誤！-1❤️`,
                color: isCorrect ? '#059669' : '#dc2626',
                bgColor: isCorrect ? 'rgba(209, 250, 229, 0.95)' : 'rgba(254, 226, 226, 0.95)',
                vy: -1.8,
                alpha: 1,
                scale: 1.2
            });
        }

        function nextQuestion() {
            gameState.questionCount++;
            gameState.level = Math.floor((gameState.questionCount - 1) / 3) + 1;
            
            const qData = QuestionGenerator.generate(gameState.level);
            gameState.currentQuestion = qData;
            gameState.questionStartTime = Date.now();

            document.getElementById('question-level').innerText = `第 ${gameState.questionCount} 題 / 關卡 ${gameState.level}`;
            document.getElementById('question-text').innerText = qData.question;

            spawnTargets(qData);
        }

        function triggerScreenShake() {
            canvas.classList.remove('shake-screen');
            void canvas.offsetWidth;
            canvas.classList.add('shake-screen');
            setTimeout(() => canvas.classList.remove('shake-screen'), 400);
        }

        function handleHit(target) {
            if (target.isCorrect) {
                // Correct target hit: Bright celebratory explosion
                soundFX.playHitCorrect();
                createShatterEffect(target, true);
                
                const timeTaken = (Date.now() - gameState.questionStartTime) / 1000;
                const speedBonus = Math.max(0, Math.floor(100 - timeTaken * 8));
                gameState.combo++;
                const points = (100 + speedBonus) * gameState.combo;
                
                gameState.score += points;
                updateHUD();

                arrow = null;
                setTimeout(nextQuestion, 650);
            } else {
                // Wrong target hit: Red warning flash, screen shake, minus 1 heart
                soundFX.playHitWrong();
                triggerScreenShake();
                createShatterEffect(target, false);
                
                gameState.lives--;
                gameState.combo = 0;
                updateHUD();

                arrow = null;

                if (gameState.lives <= 0) {
                    setTimeout(endGame, 700);
                }
            }
        }

        function updateHUD() {
            document.getElementById('hud-player-name').innerText = gameState.playerName || '神射手';
            document.getElementById('score-text').innerText = gameState.score.toString().padStart(4, '0');
            
            const comboBadge = document.getElementById('combo-badge');
            if (gameState.combo > 1) {
                comboBadge.classList.remove('hidden');
                document.getElementById('combo-count').innerText = `x${gameState.combo}`;
            } else {
                comboBadge.classList.add('hidden');
            }

            const heartsContainer = document.getElementById('lives-container');
            let heartsHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < gameState.lives) {
                    heartsHTML += `<i class="fa-solid fa-heart heart-bounce"></i>`;
                } else {
                    heartsHTML += `<i class="fa-regular fa-heart text-slate-300"></i>`;
                }
            }
            heartsContainer.innerHTML = heartsHTML;
        }

        function update() {
            if (!gameState.active) return;

            // 1. Update Floating Dynamic Background Elements
            bgElements.forEach(bg => {
                bg.x += bg.vx;
                bg.y += bg.vy;
                if (bg.x < -40) bg.x = canvas.width + 40;
                if (bg.x > canvas.width + 40) bg.x = -40;
                if (bg.y < -40) bg.y = canvas.height + 40;
            });

            // 2. Update Targets movement
            targets.forEach(t => {
                t.x += t.vx;
                if (t.x - t.radius < 10 || t.x + t.radius > canvas.width - 10) {
                    t.vx *= -1;
                }
            });

            // 3. Update Arrow projectile
            if (arrow) {
                arrow.x += arrow.vx;
                arrow.y += arrow.vy;

                // Out of bounds miss
                if (arrow.x < 0 || arrow.x > canvas.width || arrow.y < 0) {
                    arrow = null;
                    soundFX.playHitWrong();
                    triggerScreenShake();
                    
                    // Spawn miss text
                    floatingTexts.push({
                        x: bow.x,
                        y: bow.y - 120,
                        text: `❌ 脫靶！-1❤️`,
                        color: '#dc2626',
                        bgColor: 'rgba(254, 226, 226, 0.95)',
                        vy: -1.5,
                        alpha: 1,
                        scale: 1.1
                    });

                    gameState.lives--;
                    gameState.combo = 0;
                    updateHUD();

                    if (gameState.lives <= 0) {
                        setTimeout(endGame, 700);
                    }
                } else {
                    for (let t of targets) {
                        const dist = Math.hypot(arrow.x - t.x, arrow.y - t.y);
                        if (dist < t.radius + 8) {
                            handleHit(t);
                            break;
                        }
                    }
                }
            }

            // 4. Update Target Shatter Shards
            targetShards.forEach((s, idx) => {
                s.x += s.vx;
                s.y += s.vy;
                s.vy += 0.22; // gravity drop
                s.rotation += s.rotSpeed;
                s.alpha -= 0.022;
                if (s.alpha <= 0) {
                    targetShards.splice(idx, 1);
                }
            });

            // 5. Update Dust Particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            // 6. Update Floating Text Popups
            floatingTexts.forEach((ft, index) => {
                ft.y += ft.vy;
                ft.alpha -= 0.018;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(index, 1);
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Dynamic Background Elements
            bgElements.forEach(bg => {
                ctx.save();
                ctx.globalAlpha = bg.alpha;
                if (bg.isCloud) {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(bg.x, bg.y, bg.radius, 0, Math.PI * 2);
                    ctx.arc(bg.x + bg.radius * 0.6, bg.y - bg.radius * 0.2, bg.radius * 0.75, 0, Math.PI * 2);
                    ctx.arc(bg.x - bg.radius * 0.6, bg.y, bg.radius * 0.65, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#0f766e';
                    ctx.font = `bold ${bg.size}px monospace`;
                    ctx.fillText(bg.text, bg.x, bg.y);
                }
                ctx.restore();
            });

            // 2. Draw Shooting Range Line
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.2)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 120);
            ctx.lineTo(canvas.width, canvas.height - 120);
            ctx.stroke();
            ctx.setLineDash([]);

            // 3. Draw Target Circles
            targets.forEach(t => {
                ctx.save();
                ctx.translate(t.x, t.y);

                // Outer Shadow
                ctx.beginPath();
                ctx.arc(0, 0, t.radius + 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.06)';
                ctx.fill();

                // Target Body
                ctx.beginPath();
                ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#059669';
                ctx.lineWidth = 4;
                ctx.fill();
                ctx.stroke();

                // Inner Bullseye Ring
                ctx.beginPath();
                ctx.arc(0, 0, t.radius * 0.74, 0, Math.PI * 2);
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Center Dot
                ctx.beginPath();
                ctx.arc(0, 0, t.radius * 0.22, 0, Math.PI * 2);
                ctx.fillStyle = '#f59e0b';
                ctx.fill();

                // Target Text Expression
                ctx.fillStyle = '#0f172a';
                ctx.font = `900 ${Math.max(13, Math.floor(t.radius * 0.31))}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t.text, 0, 0);

                ctx.restore();
            });

            // 4. Draw Shatter Shards
            targetShards.forEach(s => {
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.rotation);
                ctx.globalAlpha = Math.max(0, s.alpha);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, s.radius, s.startAngle, s.endAngle);
                ctx.closePath();
                ctx.fillStyle = s.color;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            });

            // 5. Draw Bow & Arrow matching user reference diagram (image_f328df.png)
            ctx.save();
            ctx.translate(bow.x, bow.y);
            ctx.rotate(bow.angle + Math.PI / 2); // Rotate relative to aiming angle

            const bowWidth = 110;
            const bowArchHeight = 36;
            const pullBack = bow.isDragging ? 25 : 0;

            // Dashed Aim Trajectory Extension Line pointing straight forward (as drawn in sketch)
            ctx.save();
            ctx.setLineDash([8, 8]);
            ctx.strokeStyle = 'rgba(15, 23, 42, 0.45)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -60);
            ctx.lineTo(0, -280);
            ctx.stroke();
            ctx.restore();

            // Smooth Upward-Curving Bow Limb (Matching image_f328df.png convex arch)
            ctx.beginPath();
            ctx.moveTo(-bowWidth / 2, 0);
            ctx.quadraticCurveTo(0, -bowArchHeight, bowWidth / 2, 0);
            ctx.strokeStyle = '#1e293b'; // Slate dark bow frame
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Inner Bow Limb Highlight Thread
            ctx.beginPath();
            ctx.moveTo(-bowWidth / 2 + 4, -1);
            ctx.quadraticCurveTo(0, -bowArchHeight + 3, bowWidth / 2 - 4, -1);
            ctx.strokeStyle = '#059669'; // Emerald accent line
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Bow String stretched between the tips
            ctx.beginPath();
            ctx.moveTo(-bowWidth / 2, 0);
            ctx.lineTo(0, pullBack); // String nock pulled back
            ctx.lineTo(bowWidth / 2, 0);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Resting Arrow aligned vertically along the central axis
            if (!arrow) {
                ctx.save();
                ctx.translate(0, pullBack);

                // Arrow Shaft
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -65);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // Arrow Head (Triangle arrow matching diagram)
                ctx.beginPath();
                ctx.moveTo(0, -78);
                ctx.lineTo(-11, -60);
                ctx.lineTo(11, -60);
                ctx.closePath();
                ctx.fillStyle = '#059669';
                ctx.fill();

                // Fletching Feathers
                ctx.beginPath();
                ctx.moveTo(-6, -4); ctx.lineTo(0, 6); ctx.lineTo(6, -4);
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.restore();
            }

            ctx.restore();

            // 6. Draw Flying Arrow Projectile
            if (arrow) {
                ctx.save();
                ctx.translate(arrow.x, arrow.y);
                ctx.rotate(Math.atan2(arrow.vy, arrow.vx) + Math.PI / 2);

                // Arrow Shaft
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(0, -25);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // Arrow Head
                ctx.beginPath();
                ctx.moveTo(0, -38);
                ctx.lineTo(-10, -22);
                ctx.lineTo(10, -22);
                ctx.closePath();
                ctx.fillStyle = '#059669';
                ctx.fill();

                ctx.restore();
            }

            // 7. Draw Dust Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            });

            // 8. Draw Floating Text Popups (✔ 正確！/ ❌ 錯誤！)
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.translate(ft.x, ft.y);

                // Badge Container Box
                ctx.font = '900 16px "Noto Sans TC", sans-serif';
                const textWidth = ctx.measureText(ft.text).width;
                const px = 14, py = 8;

                ctx.fillStyle = ft.bgColor;
                ctx.strokeStyle = ft.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-textWidth / 2 - px, -py - 12, textWidth + px * 2, py * 2 + 16, 12);
                ctx.fill();
                ctx.stroke();

                // Text
                ctx.fillStyle = ft.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ft.text, 0, -2);

                ctx.restore();
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            const nicknameInput = document.getElementById('nickname-input');
            const pName = nicknameInput ? nicknameInput.value.trim() : '神射手';
            
            gameState = {
                active: true,
                playerName: pName || '神射手',
                score: 0,
                lives: 3,
                level: 1,
                questionCount: 0,
                combo: 0,
                currentQuestion: null,
                questionStartTime: Date.now()
            };

            arrow = null;
            particles = [];
            targetShards = [];
            floatingTexts = [];

            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('aim-hint').classList.remove('hidden');

            resizeCanvas();
            updateHUD();
            nextQuestion();
        }

        function endGame() {
            gameState.active = false;
            document.getElementById('settlement-nickname').innerText = gameState.playerName;
            document.getElementById('final-score').innerText = gameState.score;
            document.getElementById('final-questions').innerText = Math.max(0, gameState.questionCount - 1);
            document.getElementById('gameover-modal').classList.remove('hidden');
        }

        window.onload = function() {
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
